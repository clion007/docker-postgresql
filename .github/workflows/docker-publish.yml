name: PostgreSQL Docker Image Publish

on:
  workflow_dispatch:
    inputs:
      PG_VERSION:
        required: false
        type: string
        description: 'PostgreSQL version to build (e.g. 18.6); empty means the latest stable version'
  repository_dispatch:
    types: [PostgreSQL Image Update]

jobs:
  PostgreSQL_Publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      actions: write   # gha build cache + delete workflow runs

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Resolve PostgreSQL version
      id: getVersion
      run: |
        # version from workflow input, otherwise the official latest stable via API
        PG_VERSION="${{ inputs.PG_VERSION }}"
        if [ -z "$PG_VERSION" ]; then
          PG_VERSION=$(curl -fsSL https://www.postgresql.org/versions.json \
            | jq -r '.[] | select(.current == true) | "\(.major).\(.latestMinor)"')
        fi
        [ -n "$PG_VERSION" ] || { echo "ERROR: unable to resolve PostgreSQL version" >&2; exit 1; }
        PG_MAJOR=${PG_VERSION%%.*}
        echo "pgVersion=$PG_VERSION" >> $GITHUB_OUTPUT
        echo "pgMajor=$PG_MAJOR" >> $GITHUB_OUTPUT
        TAGS="clion007/postgresql:latest
        clion007/postgresql:${PG_VERSION}
        registry.cn-chengdu.aliyuncs.com/clion/postgresql:latest
        registry.cn-chengdu.aliyuncs.com/clion/postgresql:${PG_VERSION}"
        echo "tags<<EOF" >> $GITHUB_OUTPUT
        echo "$TAGS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Login to AliYun Registry
      uses: docker/login-action@v4
      with:
        registry: registry.cn-chengdu.aliyuncs.com
        username: ${{ secrets.ALIYUN_USER }}
        password: ${{ secrets.ALIYUN_TOKEN }}

    - name: Build and Push Docker images
      id: build
      uses: docker/build-push-action@v7
      with:
        file: Dockerfile
        context: .
        push: true
        provenance: false
        build-args: |
          PG_VERSION=${{ steps.getVersion.outputs.pgVersion }}
          PG_MAJOR=${{ steps.getVersion.outputs.pgMajor }}
        tags: ${{ steps.getVersion.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2
