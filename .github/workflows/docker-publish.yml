name: PostgreSQL Docker Image Publish

on:
  workflow_dispatch:
    inputs:
      PG_VERSION:
        required: false
        type: string
        description: 'PostgreSQL version to build (e.g. 18.6); empty means the latest stable version'
  repository_dispatch:
    types: [PostgreSQL Image Update]

jobs:
  PostgreSQL_Publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Resolve PostgreSQL version
      id: getVersion
      run: |
        # current stable major from official (used to decide whether to refresh the "latest" tag)
        CURRENT_MAJOR=$(curl -fsSL https://www.postgresql.org/versions.json \
          | python3 -c "import sys,json; d=[x for x in json.load(sys.stdin) if x.get('current')]; print(d[0]['major'] if d else '')")
        if [ -n "${{ inputs.PG_VERSION }}" ]; then
          PG_VERSION="${{ inputs.PG_VERSION }}"
        elif [ -n "${{ github.event.client_payload.pg_version }}" ]; then
          PG_VERSION="${{ github.event.client_payload.pg_version }}"
        else
          PG_VERSION=$(curl -fsSL https://www.postgresql.org/versions.json \
            | python3 -c "import sys,json; d=[x for x in json.load(sys.stdin) if x.get('current')]; print(f\"{d[0]['major']}.{d[0]['latestMinor']}\" if d else '')")
        fi
        if [ -z "$PG_VERSION" ] || [ -z "$CURRENT_MAJOR" ]; then
          echo "ERROR: unable to resolve PostgreSQL version" >&2
          exit 1
        fi
        PG_MAJOR=${PG_VERSION%%.*}
        echo "pgVersion=$PG_VERSION" >> $GITHUB_OUTPUT
        echo "pgMajor=$PG_MAJOR" >> $GITHUB_OUTPUT
        # build the tag list; only refresh "latest" when building the current stable major
        TAGS="clion007/postgresql:${PG_MAJOR}
        clion007/postgresql:${PG_VERSION}
        registry.cn-chengdu.aliyuncs.com/clion/postgresql:${PG_MAJOR}
        registry.cn-chengdu.aliyuncs.com/clion/postgresql:${PG_VERSION}"
        if [ "$PG_MAJOR" = "$CURRENT_MAJOR" ]; then
          TAGS="${TAGS}
        clion007/postgresql:latest
        registry.cn-chengdu.aliyuncs.com/clion/postgresql:latest"
        fi
        echo "tags<<EOF" >> $GITHUB_OUTPUT
        echo "$TAGS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "Resolved: PostgreSQL $PG_VERSION (major $PG_MAJOR) - latest tag: $([ "$PG_MAJOR" = "$CURRENT_MAJOR" ] && echo yes || echo no)"

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Login to AliYun Registry
      uses: docker/login-action@v4
      with:
        registry: registry.cn-chengdu.aliyuncs.com
        username: ${{ secrets.ALIYUN_USER }}
        password: ${{ secrets.ALIYUN_TOKEN }}

    - name: Build and Push Docker images
      id: build
      uses: docker/build-push-action@v7
      with:
        file: Dockerfile
        context: .
        push: true
        provenance: false
        build-args: |
          PG_VERSION=${{ steps.getVersion.outputs.pgVersion }}
          PG_MAJOR=${{ steps.getVersion.outputs.pgMajor }}
        tags: ${{ steps.getVersion.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2
